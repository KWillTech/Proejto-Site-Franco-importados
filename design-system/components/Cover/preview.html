<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--bg); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cv svg { position: absolute; inset: 0; }
  .ink { fill: var(--surface-inverse); }
  .speck { fill: var(--speckle); }
  .sub { fill: var(--ink-subtle); }
  .sale { fill: var(--sale); }
  .glyph { fill: var(--bg); font-family: var(--font-display); font-weight: 700; }
  .rule { stroke: var(--line-strong); stroke-width: var(--hairline); }
  .name { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name h1 { margin: 0; font: 700 80px/0.95 var(--font-display); color: var(--ink); letter-spacing: -0.01em; }
  .name p { margin: 8px 0 0; font: 400 14px/20px var(--font-sans); color: var(--ink-muted); letter-spacing: 0.04em; }
</style></head>
<body>
<div class="cv">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: surface-inverse 288×288 slab (space-24 ×3) bleeding top/bottom/right · speckle 96×192 (space-24 × 2) · ink-subtle 96×96 · sale 48×48 (space-12), all radius-none
      arrangement: one tall black slab with satellites stepping down to its left, like the monogram's mass beside the spaced wordmark
      pattern row: "distinctive display face → one oversized glyph" — the logo IS a Bodoni FR monogram, so its R is cut from the slab in the ground colour
      steps & radii: space-12 (48), space-24 (96) pitches; radius-none everywhere; hairline rule at y=48 spans the satellites
    -->
    <defs><clipPath id="slab"><rect x="672" y="0" width="288" height="288"/></clipPath></defs>
    <rect class="sub" x="480" y="192" width="96" height="96"/>
    <rect class="speck" x="576" y="96" width="96" height="192"/>
    <rect class="sale" x="624" y="48" width="48" height="48"/>
    <rect class="ink" x="672" y="0" width="288" height="288"/>
    <g clip-path="url(#slab)"><text class="glyph" x="690" y="300" font-size="360">R</text></g>
    <line class="rule" x1="480" y1="48" x2="624" y2="48"/>
  </svg>
  <div class="name">
    <h1>Franco<br>Importados</h1>
    <p>Atacado e varejo — importados selecionados.</p>
  </div>
</div>
</body>
</html>
